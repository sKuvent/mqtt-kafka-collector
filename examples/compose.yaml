# Disposable local demonstration. Plaintext, anonymous MQTT, one Kafka broker.
services:
  mqtt:
    image: eclipse-mosquitto:2.0.22
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    mem_limit: 1g
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on: [kafka]
    entrypoint: ['/bin/bash', '-ec']
    command:
      - |
        for attempt in {1..60}; do
          if /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list; then
            exec /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic mqtt.raw.v1 --partitions 3 --replication-factor 1
          fi
          sleep 2
        done
        exit 1
  collector:
    build: ..
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mqtt:
        condition: service_started
    environment:
      MQTT_URI: tcp://mqtt:1883
      MQTT_TOPIC: sensors/#
      MQTT_CLIENT_ID: demo-collector
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: mqtt.raw.v1
    ports: ['127.0.0.1:8080:8000']
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:rw,exec,size=64m,mode=1777']
    volumes: ['collector-state:/app/state']
    mem_limit: 384m
    stop_grace_period: 35s
volumes:
  mqtt-data:
  collector-state:
